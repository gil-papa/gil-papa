<svg xmlns="http://www.w3.org/2000/svg" width="640" height="208" viewBox="0 0 640 208" role="img" aria-label="Linguagens: Kotlin 75,1%, Rust 12,0%, Python 3,6%, HTML 3,5%, JavaScript 2,4%, Outras 3,3%">
<style>
  .seg { transform-origin:left center; transform-box:fill-box;
         animation:grow .7s cubic-bezier(.2,.75,.3,1) both }
  @keyframes grow { from { transform:scaleX(0) } to { transform:scaleX(1) } }
  /* opacidade base 1 e o zero dentro do @keyframes: com animação o efeito é o
     mesmo, sem animação o card aparece em vez de ficar invisível. */
  .fade { animation:fade .5s ease-out both }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif }
  .kicker { font-size:11px; font-weight:600; fill:#c3c2b7; letter-spacing:.08em }
  .hero   { font-size:46px; font-weight:700; fill:#ffffff }
  .pct    { font-size:20px; font-weight:600; fill:#c3c2b7 }
  .sub    { font-size:12px; fill:#c3c2b7 }
  .chip   { font-size:11px; fill:#c3c2b7 }
</style>
<rect width="640" height="208" rx="10" fill="#1a1a19" stroke="#383835"/>
<g class="fade">
  <text class="kicker" x="24" y="44">LINGUAGENS</text>
  <text class="hero"   x="24" y="94">Kotlin</text>
  <text class="pct"    x="183" y="94">75,1%</text>
  <text class="sub"    x="24" y="120">8 linguagens em 9 repositórios</text>
</g>
  <rect class="seg" x="24.0" y="142" width="437.2" height="14" rx="7.0" fill="#3987e5" style="animation-delay:180ms"/>
  <rect class="seg" x="463.2" y="142" width="70.1" height="14" rx="7.0" fill="#d95926" style="animation-delay:270ms"/>
  <rect class="seg" x="535.3" y="142" width="20.9" height="14" rx="7.0" fill="#199e70" style="animation-delay:360ms"/>
  <rect class="seg" x="558.1" y="142" width="20.6" height="14" rx="7.0" fill="#c98500" style="animation-delay:450ms"/>
  <rect class="seg" x="580.7" y="142" width="14.2" height="14" rx="7.0" fill="#d55181" style="animation-delay:540ms"/>
  <rect class="seg" x="596.9" y="142" width="19.1" height="14" rx="7.0" fill="#77766d" style="animation-delay:630ms"/>
  <g class="fade" style="animation-delay:700ms"><circle cx="28.0" cy="184" r="4" fill="#3987e5"/><text class="chip" x="37.0" y="188">Kotlin 75,1%</text></g>
  <g class="fade" style="animation-delay:760ms"><circle cx="126.8" cy="184" r="4" fill="#d95926"/><text class="chip" x="135.8" y="188">Rust 12,0%</text></g>
  <g class="fade" style="animation-delay:820ms"><circle cx="213.3" cy="184" r="4" fill="#199e70"/><text class="chip" x="222.3" y="188">Python 3,6%</text></g>
  <g class="fade" style="animation-delay:880ms"><circle cx="306.0" cy="184" r="4" fill="#c98500"/><text class="chip" x="315.0" y="188">HTML 3,5%</text></g>
  <g class="fade" style="animation-delay:940ms"><circle cx="386.3" cy="184" r="4" fill="#d55181"/><text class="chip" x="395.3" y="188">JavaScript 2,4%</text></g>
  <g class="fade" style="animation-delay:1000ms"><circle cx="503.6" cy="184" r="4" fill="#77766d"/><text class="chip" x="512.6" y="188">Outras 3,3%</text></g>
</svg>