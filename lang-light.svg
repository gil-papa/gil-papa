<svg xmlns="http://www.w3.org/2000/svg" width="640" height="208" viewBox="0 0 640 208" role="img" aria-label="Linguagens: Kotlin 74,9%, Rust 11,6%, HTML 4,0%, Python 3,9%, JavaScript 2,4%, Outras 3,2%">
<style>
  .seg { transform-origin:left center; transform-box:fill-box;
         animation:grow .7s cubic-bezier(.2,.75,.3,1) both }
  @keyframes grow { from { transform:scaleX(0) } to { transform:scaleX(1) } }
  /* opacidade base 1 e o zero dentro do @keyframes: com animação o efeito é o
     mesmo, sem animação o card aparece em vez de ficar invisível. */
  .fade { animation:fade .5s ease-out both }
  @keyframes fade { from { opacity:0 } to { opacity:1 } }
  text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif }
  .kicker { font-size:11px; font-weight:600; fill:#52514e; letter-spacing:.08em }
  .hero   { font-size:46px; font-weight:700; fill:#0b0b0b }
  .pct    { font-size:20px; font-weight:600; fill:#52514e }
  .sub    { font-size:12px; fill:#52514e }
  .chip   { font-size:11px; fill:#52514e }
</style>
<rect width="640" height="208" rx="10" fill="#fcfcfb" stroke="#e6e5e1"/>
<g class="fade">
  <text class="kicker" x="24" y="44">LINGUAGENS</text>
  <text class="hero"   x="24" y="94">Kotlin</text>
  <text class="pct"    x="183" y="94">74,9%</text>
  <text class="sub"    x="24" y="120">8 linguagens em 9 repositórios</text>
</g>
  <rect class="seg" x="24.0" y="142" width="435.9" height="14" rx="7.0" fill="#2a78d6" style="animation-delay:180ms"/>
  <rect class="seg" x="461.9" y="142" width="67.8" height="14" rx="7.0" fill="#eb6834" style="animation-delay:270ms"/>
  <rect class="seg" x="531.7" y="142" width="23.4" height="14" rx="7.0" fill="#1baf7a" style="animation-delay:360ms"/>
  <rect class="seg" x="557.1" y="142" width="22.7" height="14" rx="7.0" fill="#eda100" style="animation-delay:450ms"/>
  <rect class="seg" x="581.8" y="142" width="13.7" height="14" rx="6.9" fill="#e87ba4" style="animation-delay:540ms"/>
  <rect class="seg" x="597.5" y="142" width="18.5" height="14" rx="7.0" fill="#9a998f" style="animation-delay:630ms"/>
  <g class="fade" style="animation-delay:700ms"><circle cx="28.0" cy="184" r="4" fill="#2a78d6"/><text class="chip" x="37.0" y="188">Kotlin 74,9%</text></g>
  <g class="fade" style="animation-delay:760ms"><circle cx="126.8" cy="184" r="4" fill="#eb6834"/><text class="chip" x="135.8" y="188">Rust 11,6%</text></g>
  <g class="fade" style="animation-delay:820ms"><circle cx="213.3" cy="184" r="4" fill="#1baf7a"/><text class="chip" x="222.3" y="188">HTML 4,0%</text></g>
  <g class="fade" style="animation-delay:880ms"><circle cx="293.6" cy="184" r="4" fill="#eda100"/><text class="chip" x="302.6" y="188">Python 3,9%</text></g>
  <g class="fade" style="animation-delay:940ms"><circle cx="386.3" cy="184" r="4" fill="#e87ba4"/><text class="chip" x="395.3" y="188">JavaScript 2,4%</text></g>
  <g class="fade" style="animation-delay:1000ms"><circle cx="503.5" cy="184" r="4" fill="#9a998f"/><text class="chip" x="512.5" y="188">Outras 3,2%</text></g>
