<svg xmlns="http://www.w3.org/2000/svg" width="640" height="238" viewBox="0 0 640 238" role="img" aria-label="Stack: Gradle em 3 repositórios, Kotlin em 3 repositórios, Rust em 3 repositórios, Swift em 3 repositórios, Coroutines/Flow em 2 repositórios, JavaScript em 2 repositórios, Jetpack Compose em 2 repositórios, KMP em 2 repositórios, Ktor em 2 repositórios, Python em 2 repositórios, CameraX em 1 repositórios, Docker em 1 repositórios, GitHub Actions em 1 repositórios, Koin em 1 repositórios, SQLDelight em 1 repositórios, TypeScript em 1 repositórios">
<style>
