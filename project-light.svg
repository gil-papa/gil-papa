<svg xmlns="http://www.w3.org/2000/svg" width="840" height="548" viewBox="0 0 840 548" role="img" aria-label="Projetos pessoais: 1 em produção · 4 em andamento. App Android (em produção), Jogo 2D para Android (em andamento), Analisador de disco para macOS (em andamento), Monitor de rede por processo (em andamento), Temperatura da CPU no Apple Silicon (em andamento).">
<defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7f52ff"/><stop offset="50%" stop-color="#c811e2"/><stop offset="100%" stop-color="#e54857"/></linearGradient></defs>
<style>
